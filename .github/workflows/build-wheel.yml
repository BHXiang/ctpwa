# GitHub Actions: manylinux_2_34 wheel 构建 + 发布
#
# 触发方式:
#   1. 打 tag:  git tag v0.4.0 && git push origin v0.4.0
#   2. 手动:   Actions 页面 → build-wheel → Run workflow
#
# 产物:
#   - manylinux_2_34_x86_64 wheel（含 sm_70~sm_120 共 8 个 SASS 变体）
#   - 上传到 PyPI（需配置 secret: PYPI_API_TOKEN）
#
# 安装（目标机器）:
#   # 系统依赖: CUDA 12.9 runtime、ROOT(6.26+)；yaml-cpp 已静态打包进 wheel，无需安装
#   pip install torch==2.12.0+cu126 --index-url https://download.pytorch.org/whl/cu126
#   pip install ctpwa
#
# 注意: 构建在 almalinux:9 容器（glibc 2.34）中进行——manylinux 标签必须 <=
#       构建环境的最低 glibc 符号版本，产物才能标 manylinux_2_34。覆盖:
#       AlmaLinux 9.8 / RHEL 9 / Rocky 9（glibc 2.34）以及 Ubuntu 22.04+（2.35）。
#       ROOT 库不打包，目标机器需 source thisroot.sh 且 ROOT >= 6.26（SONAME 兼容）。
#       sm_70（V100）需 CUDA 12.x 工具链（13.x 已移除 Volta）；sm_120（RTX 50 系）
#       需 driver >= 570。cu126 是 PyTorch 官方保留旧架构的 legacy 构建，仅存在于
#       download.pytorch.org（PyPI 没有）。

name: build-wheel

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # almalinux:9（glibc 2.34）容器中构建，产物符号 <= 2.34 → manylinux_2_34 合法。
    # 不用 auditwheel repair（patchelf 重写 ELF 会破坏 .nv_fatbin 加载），
    # 只手动改 WHEEL 元数据标签，最后用 auditwheel show 验证符号版本。
    runs-on: ubuntu-22.04
    container:
      image: almalinux:9

    steps:
      - uses: actions/checkout@v4

      # ---- 0. 基础工具: git/gcc/cmake（容器精简，编译前补齐）----
      # 注意: 不装 curl——almalinux:9 内置 curl-minimal（与完整 curl 包互斥），
      #        curl 命令由 curl-minimal 提供，后续步骤直接用。
      # ninja 用 conda 装（AlmaLinux 9 默认 repo 无 ninja-build，需 EPEL）。
      - name: Install base tools
        run: |
          dnf install -y -q git gcc-c++ cmake
          gcc --version | head -1
          curl --version | head -1
          cmake --version | head -1

      # ---- 0b. 版本一致性: tag 名必须等于 setup.py 版本（防 400 重传）----
      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -oP 'version="\K[^"]+' setup.py | head -1)
          if [ "$TAG" != "$VER" ]; then
            echo "ERROR: tag $TAG != setup.py version $VER —— 同步 setup.py 版本号后重打 tag"
            exit 1
          fi
          echo "version $VER matches tag ✓"

      # ---- 1. CUDA 12.9 toolkit（NVIDIA rhel9 repo，nvcc + runtime headers）----
      # sm_70（V100）需要 CUDA 12.x（13.x 移除 Volta）；sm_120 需 >= 12.8 → 12.9 全设备覆盖
      - name: Install CUDA 12.9 toolkit
        run: |
          curl -sSL -o /etc/yum.repos.d/cuda-rhel9.repo \
            https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/cuda-rhel9.repo
          dnf install -y -q cuda-toolkit-12-9
          /usr/local/cuda-12.9/bin/nvcc --version | tail -1
          /usr/local/cuda-12.9/bin/nvcc --list-gpu-arch | grep -E "compute_70|compute_80|compute_120"

      # ---- 2. miniconda: Python 3.12 + ROOT + torch(cu126) ----
      # 用 conda-forge 单独建 build env（--override-channels 排除 defaults 源）：
      # miniconda base 默认混 defaults 源，与 conda-forge 的 root 依赖链
      # （libxml2/icu 等）solve 冲突。一次 create 统一 solve 更稳。
      - name: Install miniconda and deps
        run: |
          curl -sSL https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh \
            -o /tmp/miniconda.sh
          bash /tmp/miniconda.sh -b -p /opt/conda
          # ninja: torch cpp_extension 在 dlink=True 时强制要求（缺了会直接 abort）
          /opt/conda/bin/conda create -y -q -p /opt/conda/envs/build \
            --override-channels -c conda-forge \
            python=3.12 root ninja
          /opt/conda/envs/build/bin/pip install -q "torch==2.12.0+cu126" \
            --index-url https://download.pytorch.org/whl/cu126
          /opt/conda/envs/build/bin/pip install -q auditwheel
          /opt/conda/envs/build/bin/python -c "import torch; print('torch', torch.__version__)"
          /opt/conda/envs/build/bin/root-config --version

      # ---- 2b. yaml-cpp 0.8.0 源码静态编译 → /usr/local ----
      # 静态链接进 ctpwa.so（setup.py 的 library_dirs 末尾 /usr/local/lib 兜底），
      # wheel 自包含 yaml-cpp，目标机器无需安装（与本地 conda 动态链接不冲突——
      # 本机 conda 的 libyaml-cpp.so 优先命中）。ROOT/CUDA runtime/torch 太大，
      # 仍由目标机器环境提供。
      - name: Build static yaml-cpp
        run: |
          curl -sSL https://github.com/jbeder/yaml-cpp/archive/refs/tags/0.8.0.tar.gz \
            -o /tmp/yaml-cpp.tar.gz
          tar xzf /tmp/yaml-cpp.tar.gz -C /tmp
          cmake -S /tmp/yaml-cpp-0.8.0 -B /tmp/yaml-build \
            -DYAML_BUILD_SHARED_LIBS=OFF \
            -DYAML_CPP_BUILD_TESTS=OFF \
            -DYAML_CPP_BUILD_TOOLS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build /tmp/yaml-build -j"$(nproc)"
          cmake --install /tmp/yaml-build
          ls -l /usr/local/lib/libyaml-cpp.a

      # ---- 3. 构建 wheel（容器 glibc 2.34 → manylinux_2_34 标签）----
      - name: Build wheel
        env:
          CUDA_HOME: /usr/local/cuda-12.9
          ROOTSYS: /opt/conda/envs/build
          # 无 GPU runner 上 torch 检测不到架构 → 显式指定（空格分隔）
          # 7.0 = V100, 12.0 = RTX 50 系（Blackwell）
          TORCH_CUDA_ARCH_LIST: "7.0 7.5 8.0 8.6 8.9 9.0 10.0 12.0"
        run: |
          # PATH 必须在 bash 内展开（workflow env 的 $PATH 是字面量，
          # 会污染 runner 的 shell 查找 → exec: bash not found）
          export PATH=/opt/conda/envs/build/bin:$PATH
          # 手动改 manylinux 标签（只改 WHEEL 元数据和文件名，不碰 ELF）
          python setup.py bdist_wheel
          WHEEL=$(ls -1 dist/ctpwa-*.whl | head -1)
          python - <<PYEOF
          import zipfile, os
          src = "$WHEEL"
          dst = src.replace("linux_x86_64", "manylinux_2_34_x86_64")
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst, "w") as zout:
              for item in zin.infolist():
                  data = zin.read(item.filename)
                  if item.filename.endswith("WHEEL"):
                      data = data.replace(b"linux_x86_64", b"manylinux_2_34_x86_64")
                  zout.writestr(item, data)
          os.remove(src)
          PYEOF
          mkdir -p wheelhouse && mv dist/ctpwa-*.whl wheelhouse/
          # 验证: 产物最低 glibc 符号版本必须是 2.34（manylinux_2_34 合法性的依据）
          auditwheel show wheelhouse/ctpwa-*.whl
          ls -lh wheelhouse/

      # ---- 4. 上传产物到 artifact（供 publish job 下载）----
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctpwa-wheel
          path: wheelhouse/

  # 发布 job: 必须用原生 runner——gh-action-pypi-publish 是 Docker action，
  # 容器 job 里无法运行（实测 create-docker-action.py 找不到）。
  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ctpwa-wheel
          path: wheelhouse/

      # ---- 5. 上传 wheel 到 PyPI（secrets.PYPI_API_TOKEN）----
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: wheelhouse/
