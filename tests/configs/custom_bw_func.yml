# Custom DSL BW() 函数测试 config（对比基准: custom_bw.yml 内置 BW）
# expr: BW(p0, p1) ≡ 内置 BW(m, m0, w0) —— m 由包装内部自动补全
# 参数键用新规范名 paramValues/paramNames（旧名 parameters/params 仍兼容）
# 数据相对路径从 tests/ 目录解析（conftest.py 会 chdir 到 tests/）
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\eta']
  Kp:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{+}']
  Km:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{-}']

Data:
  order: [Kp, Km, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]
  bkg:  [dat, "./data/test_sideband.dat"]

DecayChains:
  chain1:
    decay:
      - Jpsi: [eta, R_KK]
      - R_KK: [Kp, Km]
    R_KK:
      - [J: 1, P: -1]: [bw_func_res]
    legend: [R_KK, " ", eta]

Resonances:
  bw_func_res:
    J: 1
    P: -1
    model: Custom
    paramValues: [1.66, 0.125]
    free: [-1]   # 显式声明拟合（未写 free 的参数默认不拟合）
    paramNames: [p0, p1]
    # BW(p0, p1) → MODEL_BW(m, p0, p1)，m 自动补全
    expr: "BW(p0, p1)"
    tex: ["R_{BW}"]
