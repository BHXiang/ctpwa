# Flatte (tf-pwa FlatteC 约定: D = m0²-m²-i·m0·Σ gᵢ·qᵢ/m)
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\\eta']
  Kp:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{+}']
  Km:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{-}']

Data:
  order: [Kp, Km, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]
  bkg:  [dat, "./data/test_sideband.dat"]

DecayChains:
  chain1:
    decay:
      - Jpsi: [eta, R_KK]
      - R_KK: [Kp, Km]
    R_KK:
      - [J: 1, P: -1]: [f0]
    legend: [R_KK, " ", eta]

Resonances:
  f0:
    J: 1
    P: -1
    model: Flatte
    parameters: [1.0, 0.3, 0.2]   # m0, g_pipi, g_KK (FlatteC 约定: 宽度项 = m0·g_i·q_i/m)
    free: [0, 1, 2]
    channels: [[0.1396, 0.1396], [0.4937, 0.4937]]  # ππ, KK
    tex: ["f_{0}", "(980)"]
