# phsp 流式模式（Constraints.free_phsp_amplitudes=true）测试 config
# 与 free_phsp_off.yml 物理完全一致，仅多开 free_phsp_amplitudes 开关：
#   - 构造期分块流式建 phsp 矩阵（float32 + double），phsp 振幅不驻留
#   - 拟合期 phsp_sum 走 double 矩阵（替代逐 forward 扫 phsp 振幅）
#   - writeResult/writeInterfResult 按批重算 phsp 振幅
# 要求：所有共振态质量/宽度固定（无 free 参数）
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\eta']
  Kp:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{+}']
  Km:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{-}']

Data:
  order: [Kp, Km, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]
  bkg:  [dat, "./data/test_sideband.dat"]

Constraints:
  free_phsp_amplitudes: true

DecayChains:
  chain1:
    decay:
      - Jpsi: [eta, R_KK]
      - R_KK: [Kp, Km]
    R_KK:
      - [J: 1, P: -1]: [phi1020, phi1680]
    legend: [R_KK, " ", eta]

Resonances:
  phi1020:
    J: 1
    P: -1
    model: BWR
    parameters: [1.0195, 0.0045]
    tex: ["\\phi(1020)"]

  phi1680:
    J: 1
    P: -1
    model: BWR
    parameters: [1.66, 0.125]
    tex: ["\\phi(1680)"]
