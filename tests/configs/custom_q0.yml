# Custom DSL 含 q0 变量的数值测试 config
# 表达式 (q/q0)^3 * p2：对 p0(=标称质量) 的导数完全经由 ∂q0/∂p0
# （q、m 是运动学变量导数 0）—— 专门验证 q0 的复合节点导数追踪。
# 数据相对路径从 tests/ 目录解析（conftest.py 会 chdir 到 tests/）
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\eta']
  Kp:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{+}']
  Km:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{-}']

Data:
  order: [Kp, Km, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]
  bkg:  [dat, "./data/test_sideband.dat"]

DecayChains:
  chain1:
    decay:
      - Jpsi: [eta, R_KK]
      - R_KK: [Kp, Km]
    R_KK:
      - [J: 1, P: -1]: [custom_q0_res]
    legend: [R_KK, " ", eta]

Resonances:
  custom_q0_res:
    J: 1
    P: -1
    model: Custom
    parameters: [1.66, 0.125]
    free: [-1]   # 显式声明拟合（未写 free 的参数默认不拟合）
    params: [p0, p1]
    # BWR 等价写法（example 原式）：宽度因子链里 q0 出现 4 次，
    # 对 p0 高度敏感（∂q0/∂p0 被放大），FD 信噪比好
    expr: "p0^2/(p0^2 - m^2 - 1i*p0*p1*(p1p/q0)*(p0/m)*(p1p^2+q0^2)/q0^2)"
    tex: ["R_{q0}"]
