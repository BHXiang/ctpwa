# LS 分波约束测试（无约束基线）:
# Jpsi(1-) → rho(1-) + R_rho(1-), R_rho → pip + pim
# 第一步 Jpsi → rho + R_rho 自然允许 4 个分波: (S,L) = (1,1), (3,1), (5,1), (5,3)
# 期望: nVector = 4（ls_filter_constrained 只保留 (1,1) → nVector = 1）
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  rho:
    J: 1
    P: -1
    mass: 0.775
    tex: ['\\rho']
  pip:
    J: 0
    P: -1
    mass: 0.1396
    tex: ['\\pi^{+}']
  pim:
    J: 0
    P: -1
    mass: 0.1396
    tex: ['\\pi^{-}']

Data:
  order: [rho, pip, pim]
  data: [dat, "./data/ident2_sideband.dat"]
  phsp: [dat, "./data/ident2_sideband.dat"]
  bkg:  [dat, "./data/ident2_sideband.dat"]

DecayChains:
  chain1:
    Jpsi: [[rho, R_rho]]
    R_rho: [pip, pim]
    intermediates:
      R_rho:
        - [J: 1, P: -1]: [res_rho]
    legend: [R_rho, " ", rho]

Resonances:
  res_rho:
    J: 1
    P: -1
    model: BWR
    parameters: [0.775, 0.15]
    free: [0, 1]
    tex: ["R_\\rho"]
