# 固定节点预算（静态链因子）回归 config。
# 三节点链：psip → gamma + R1;  R1 → Kp + R2;  R2 → Km + eta
#   node0 (psip→gamma R1): 子粒子 R1 的质量 free      → 自由节点（q0 依赖 θ）
#   node1 (R1→Kp R2):      R1 自身参数 free           → 自由节点
#   node2 (R2→Km eta):     R2 参数固定 + 子粒子固定   → 静态节点（折进 d_static）
# 于是 CTPWA_STATIC_DEBUG=1 应打印 static: nodes=3 static=1 mask=0x3。
# 静态因子若漏乘/错乘，振幅与 dF 的比值就不再是常数 → test_gradient_vs_fd 的
# FD 对比、以及 test_static_budget 的 CTPWA_NO_STATIC A/B 会直接失败。
Particles:
  psip:
    J: 1
    P: -1
    mass: 3.0686
    tex: ['\psi']
  gamma:
    J: 1
    P: -1
    mass: 0.0
    tex: ['\gamma']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\eta']
  Kp:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{+}']
  Km:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{-}']

Data:
  order: [gamma, Kp, Km, eta]
  data: [dat, "./data/test_4body_data.dat"]
  phsp: [dat, "./data/test_4body_phsp.dat"]
  bkg:  [dat, "./data/test_4body_sideband.dat"]

DecayChains:
  decay1:
    psip:
      - [gamma, R1]
    R1: [Kp, R2]
    R2: [Km, eta]
    intermediates:
      R1:
        - [J: 1, P: 1]: [a1]
      R2:
        - [J: 0, P: 1]: [a2]

Resonances:
  a1:
    J: 1
    P: 1
    model: BWR
    parameters: [1.8, 0.15]
    free: [0, 1]
    tex: ["a_{1}(1800)"]
  a2:
    J: 0
    P: 1
    model: BWR
    parameters: [1.2, 0.20]
    tex: ["a_{2}(1200)"]
