# 命名变量约束测试 baseline: 两个共振态 r1/r2 各 2 个自由参数 (mass, width) → 4 theta
# 约束变体 configs (constraints_fix/free/range/equal/gauss.yml) 与此完全一致，
# 只增加对应 Constraints 键。
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\eta']
  Kp:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{+}']
  Km:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{-}']

Data:
  order: [Kp, Km, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]
  bkg:  [dat, "./data/test_sideband.dat"]

Constraints:
  gauss_constr: {r1_mass: 0.01}

DecayChains:
  chain1:
    decay:
      - Jpsi: [eta, R_KK]
      - R_KK: [Kp, Km]
    R_KK:
      - [J: 1, P: -1]: [r1, r2]
    legend: [R_KK, " ", eta]

Resonances:
  r1:
    J: 1
    P: -1
    model: BWR
    parameters: [1.66, 0.125]
    free: [0, 1]
    tex: ["R_1"]
  r2:
    J: 1
    P: -1
    model: BWR
    parameters: [1.55, 0.15]
    free: [0, 1]
    tex: ["R_2"]
