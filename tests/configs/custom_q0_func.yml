# Custom DSL q0() 函数测试 config（1 参 / 3 参两种形式）
#   q0(x)          → breakup(x, md1, md2)（子粒子质量取事件值）
#   q0(x, m1, m2)  → breakup(x, m1, m2)（显式子粒子质量）
# 本 config 中子粒子为 Kp/Km（0.4937 GeV），两种形式数值相等；
# 表达式即 custom_q0.yml 的 BWR 等价式（q0 出现 4 次，对 p0 高度敏感），
# 但用 q0() 函数形式代替裸 q0 变量 —— 两种函数分支的导数都被追踪。
# 数据相对路径从 tests/ 目录解析（conftest.py 会 chdir 到 tests/）
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\eta']
  Kp:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{+}']
  Km:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{-}']

Data:
  order: [Kp, Km, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]
  bkg:  [dat, "./data/test_sideband.dat"]

DecayChains:
  chain1:
    decay:
      - Jpsi: [eta, R_KK]
      - R_KK: [Kp, Km]
    R_KK:
      - [J: 1, P: -1]: [q0_func_res]
    legend: [R_KK, " ", eta]

Resonances:
  q0_func_res:
    J: 1
    P: -1
    model: Custom
    parameters: [1.66, 0.125]
    free: [-1]   # 显式声明拟合（未写 free 的参数默认不拟合）
    params: [p0, p1]
    # 与 custom_q0.yml 同一表达式，仅 q0 变量 → q0() 函数（3 参 ×3 处 + 1 参 ×1 处）
    expr: "p0^2/(p0^2 - m^2 - 1i*p0*p1*(p1p/q0(p0, 0.4937, 0.4937))*(p0/m)*(p1p^2+q0(p0)^2)/q0(p0, 0.4937, 0.4937)^2)"
    tex: ["R_{q0}"]
