# 内置 BW 模型 config（custom.yml 的对比基准）
# 与 custom.yml 结构完全一致，仅共振态模型不同：
#   custom.yml:  Custom 表达式 g0·e^{iφ}/(m0²-m²-i·m0·w0)，g0=1, φ=0 时 ≡ 内置 BW
#   custom_bw.yml: 内置 BW(m0, w0)
# 数据相对路径从 tests/ 目录解析（conftest.py 会 chdir 到 tests/）
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\eta']
  Kp:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{+}']
  Km:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{-}']

Data:
  order: [Kp, Km, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]
  bkg:  [dat, "./data/test_sideband.dat"]

DecayChains:
  chain1:
    decay:
      - Jpsi: [eta, R_KK]
      - R_KK: [Kp, Km]
    R_KK:
      - [J: 1, P: -1]: [bw_res]
    legend: [R_KK, " ", eta]

Resonances:
  bw_res:
    J: 1
    P: -1
    model: BW
    parameters: [1.66, 0.125]
    free: [0, 1]
    tex: ["R_{bw}"]
