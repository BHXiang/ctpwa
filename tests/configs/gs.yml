# GS (Gounaris-Sakurai) model test
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\\eta']
  Kp:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{+}']
  Km:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{-}']

Data:
  order: [Kp, Km, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]
  bkg:  [dat, "./data/test_sideband.dat"]

DecayChains:
  chain1:
    decay:
      - Jpsi: [eta, R_KK]
      - R_KK: [Kp, Km]
    R_KK:
      - [J: 1, P: -1]: [gs_res]
    legend: [R_KK, " ", eta]

Resonances:
  gs_res:
    J: 1
    P: -1
    model: GS
    parameters: [1.66, 0.15]     # m0=1.66 well above KK threshold (2*0.4937=0.987)
    free: [0, 1]
    channels: [[0.4937, 0.4937]]  # daughter masses
    tex: ["GS", "_test"]
