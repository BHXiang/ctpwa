# Interp model smoke test: linear interpolation shape
Particles:
  Jpsi: {J: 1, P: -1, mass: 3.0969, tex: ['J/\\psi']}
  eta:  {J: 0, P: -1, mass: 0.5478, tex: ['\\eta']}
  Kp:   {J: 0, P: -1, mass: 0.4937, tex: ['K^{+}']}
  Km:   {J: 0, P: -1, mass: 0.4937, tex: ['K^{-}']}
Data:
  order: [Kp, Km, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]
  bkg:  [dat, "./data/test_sideband.dat"]
DecayChains:
  chain1:
    decay:
      - Jpsi: [eta, R_KK]
      - R_KK: [Kp, Km]
    R_KK:
      - [J: 1, P: -1]: [shape]
    legend: [R_KK, " ", eta]
Resonances:
  shape:
    J: 1
    P: -1
    model: Interp
    parameters: []
    options:
      file: "./data/interp_shape.dat"
      method: linear
    tex: ["Interp", "_shape"]
