# 双链 config，带 trans 约束: [R_Keta_0, R_Keta_1]: -1
# 与 no_trans.yml 结构相同，仅多 Constraints 段
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\eta']
  Kp:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{+}']
  Km:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{-}']

Data:
  order: [Kp, Km, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]
  bkg:  [dat, "./data/test_sideband.dat"]

DecayChains:
  decay1:
    Jpsi:
      - [eta, R_KK]
      - [Kp, R_Keta]
      - [Km, R_Keta]
    R_KK: [Kp, Km]
    R_Keta:
      - [Km, eta]
      - [Kp, eta]

    intermediates:
      R_KK:
        - [J: 1, P: -1]: [phi1020, phi1680]
      R_Keta:
        - [J: 1, P: -1]: [K1_1410, K1_1680]

    legends:
      - ['R_KK', 'eta']
      - ['R_Keta', "^{-}", 'Kp']
      - ['R_Keta', "^{+}", 'Km']

Constraints:
  trans:
    - [R_Keta_0, R_Keta_1]: -1

Resonances:
  phi1020:
    J: 1
    P: -1
    model: BWR
    parameters: [1.0195, 0.0045]
    tex: ["\\phi(1020)"]

  phi1680:
    J: 1
    P: -1
    model: BWR
    parameters: [1.66, 0.125]
    free: [0, 1]
    tex: ["\\phi(1680)"]

  K1_1410:
    J: 1
    P: -1
    model: BWR
    parameters: [1.402, 0.149]
    free: [0, 1]
    tex: ["K_{1}", "(1410)"]

  K1_1680:
    J: 1
    P: -1
    model: BWR
    parameters: [1.6665, 0.2961]
    tex: ["K_{1}", "(1680)"]
