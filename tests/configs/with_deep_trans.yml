# 深层 trans 约束测试 config —— R_Keta 是 R_chic1 的子中间态（第二层）
# 与 with_trans.yml（R_Keta 为顶层中间态）互补：
#   链名 = decay1_R_chic1_R_Keta_0/1（含完整中间态路径 + 实例序号），
#   约束 [R_Keta_0, R_Keta_1]: 1 直接按链名/中间态序号子串匹配。
# 比率用 1（而非 -1）—— 回归 ratio≠1 判定折叠的错误（trans 值可为 1.0）。
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\eta']
  Kp:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{+}']
  Km:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{-}']

Data:
  order: [Kp, Km, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]
  bkg:  [dat, "./data/test_sideband.dat"]

DecayChains:
  decay1:
    Jpsi:
      - [eta, R_chic1]
    R_chic1:
      - [Kp, R_Keta]
      - [Km, R_Keta]
    R_Keta:
      - [Km, eta]
      - [Kp, eta]

    intermediates:
      R_chic1:
        - [J: 1, P: 1]: [chic1]
      R_Keta:
        - [J: 1, P: -1]: [K1_1410, K1_1680]

    legends:
      - ['R_chic1', 'eta']
      - ['R_Keta', 'Kp']
      - ['R_Keta', 'Km']

Constraints:
  trans:
    - [R_Keta_0, R_Keta_1]: 1

Resonances:
  chic1:
    J: 1
    P: 1
    model: ONE
    parameters: [3.5107]
    tex: ["\\chi_{c1}"]

  K1_1410:
    J: 1
    P: -1
    model: BWR
    parameters: [1.402, 0.149]
    tex: ["K_{1}", "(1410)"]

  K1_1680:
    J: 1
    P: -1
    model: BWR
    parameters: [1.6665, 0.2961]
    tex: ["K_{1}", "(1680)"]
