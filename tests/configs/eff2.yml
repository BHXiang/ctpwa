# precision 奇偶回归用双波 config：eff.yml + 第二个同 [1-] 组共振态 phi1020
# ⇒ npartials=2：拟合分数/效率的分母含两个分波（FF 非平凡），可校验
#   precision:float 与 precision:double 的批振幅积分逐值一致。
# phsp 与 phsp_truth 指向同一文件（ε≡1 约定继承自 eff.yml）。
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\eta']
  Kp:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{+}']
  Km:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{-}']

Data:
  order: [Kp, Km, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]
  phsp_truth: [dat, "./data/test_phsp.dat"]
  bkg:  [dat, "./data/test_sideband.dat"]

DecayChains:
  chain1:
    decay:
      - Jpsi: [eta, R_KK]
      - R_KK: [Kp, Km]
    R_KK:
      - [J: 1, P: -1]: [phi1020, phi1680]
    legend: [R_KK, " ", eta]

Resonances:
  phi1020:
    J: 1
    P: -1
    model: BWR
    parameters: [1.0195, 0.0045]
    free: [0, 1]
    tex: ["\\phi(1020)"]

  phi1680:
    J: 1
    P: -1
    model: BWR
    parameters: [1.66, 0.125]
    free: [0, 1]
    tex: ["\\phi(1680)"]
