# 势垒因子: step 级显式 bf_d（Jpsi 步 0.0, R_KK 步 4.0）
# 与 bf_res4.yml（全局 0.0 + 共振态 4.0）最终值相同 → 数值一致
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\eta']
  Kp:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{+}']
  Km:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{-}']

Data:
  order: [Kp, Km, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]
  bkg:  [dat, "./data/test_sideband.dat"]

DecayChains:
  chain1:
    decay:
      - Jpsi: {daughters: [eta, R_KK], bf_d: 0.0}
      - R_KK: {daughters: [Kp, Km], bf_d: 4.0}
    R_KK:
      - [J: 1, P: -1]: [R_KK]
    legend: [R_KK, " ", eta]

Resonances:
  R_KK:
    J: 1
    P: -1
    model: BWR
    parameters: [1.66, 0.125]
    free: [0, 1]
    tex: ["R"]
