# Custom DSL Flatte() 函数测试 config（对比基准: flatte.yml 内置 Flatte）
# flatte.yml 内置 Flatte: parameters [m0, g_pipi, g_KK] = [1.0, 0.3, 0.2]，
# channels [[0.1396,0.1396],[0.4937,0.4937]]，has_bf=true、d=3.0；
# 顶点 Bf 的 L 为运行时逐波（CVAR_L，此处分波 L=1）
# DSL 等价式: Flatte(p0, p1, p2, 0.1396, 0.1396, 0.4937, 0.4937) * Bf(1, q, q0, 3.0)
#   —— Flatte() 内部展开为 buildFlatteAST（可微 AST），道质量作为字面量
# 数据相对路径从 tests/ 目录解析（conftest.py 会 chdir 到 tests/）
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\eta']
  Kp:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{+}']
  Km:
    J: 0
    P: -1
    mass: 0.4937
    tex: ['K^{-}']

Data:
  order: [Kp, Km, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]
  bkg:  [dat, "./data/test_sideband.dat"]

DecayChains:
  chain1:
    decay:
      - Jpsi: [eta, R_KK]
      - R_KK: [Kp, Km]
    R_KK:
      - [J: 1, P: -1]: [flatte_func_res]
    legend: [R_KK, " ", eta]

Resonances:
  flatte_func_res:
    J: 1
    P: -1
    model: Custom
    parameters: [1.0, 0.3, 0.2]   # m0, g_pipi, g_KK (FlatteC 约定)
    free: [-1]   # 显式声明拟合（未写 free 的参数默认不拟合）
    params: [p0, p1, p2]
    # Flatte(m0, g_pipi, g_KK, ππ 道, KK 道) × Bf —— 与内置 Flatte 默认逐点一致
    expr: "Flatte(p0, p1, p2, 0.1396, 0.1396, 0.4937, 0.4937) * Bf(1, q, q0, 3.0)"
    tex: ["f_{0}", "(980)"]
