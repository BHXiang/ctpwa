# ============================================================
# ctpwa config.yml — 示例配置（展示所有功能）
# ============================================================
# 衰变链支持两种等价写法：
#   紧凑格式（推荐）:
#     chain_name:
#       mother:
#         - [daughter1, intermediate]
#       intermediate: [d1, d2]
#       intermediates:
#         intermediate:
#           - [J: 1, P: -1]: [res1, res2]
#   展开格式:
#     chain_name:
#       decay:
#         - mother: [daughter1, intermediate]
#         - intermediate: [d1, d2]
#       intermediate:
#         - [J: 1, P: -1]: [res1, res2]
#
# 可用模型: BWR | BW | Flatte | GS | ONE | Interp | Custom
# ============================================================

# ---- 数值精度（可选, 根键 precision; 缺省 auto）----
# auto（默认）= double .so 上"混合精度": 驻留振幅矩阵 A 存 float
#   （显存约减半, 核心计算仍 double, NLL 相对漂移 ~1e-9）——大统计量
#   分波的早期大量测试推荐; float .so 上 auto = 原生 float
# float    = double .so 上同 auto（显式声明）
# double   = 全 double 数值（最终参数/分支比报告前验证用; float .so 不支持）
# 需要全 double 时取消下行注释:
# precision: double
# ============================================================

# ---- 粒子定义 ----
Particles:
  Jpsi:       {J: 1, P: -1, mass: 3.0969, tex: ['J/\\psi']}
  eta:        {J: 0, P: -1, mass: 0.5478, tex: ['\\eta']}
  Kp:         {J: 0, P: -1, mass: 0.4937, tex: ['K^{+}']}
  Km:         {J: 0, P: -1, mass: 0.4937, tex: ['K^{-}']}
  pi0:        {J: 0, P: -1, mass: 0.1350, tex: ['\\pi^{0}']}
  pip:        {J: 0, P: -1, mass: 0.1396, tex: ['\\pi^{+}']}
  pim:        {J: 0, P: -1, mass: 0.1396, tex: ['\\pi^{-}']}

# ---- 数据源 ----
Data:
  order: [Kp, Km, eta]
  data:  [dat, "./data.dat"]
  phsp:  [dat, "./phsp.dat"]
  # bkg:   [dat, "./bkg.dat"]

  # ROOT 文件格式 (TBranch 名与 order 中粒子名顺序一致):
  # data: [ROOT, "/path/file.root", TTree, Kp, Km, eta]
  # phsp: [ROOT, "/path/file.root", TTree, Kp, Km, eta]

# ---- 衰变链 ----
DecayChains:
  # 链 1: J/ψ → η KK / K⁺ Kη / K⁻ Kη (三体衰变)
  decay1:
    Jpsi:
      - [eta, R_KK]
      - [Kp, R_Keta]
      - [Km, R_Keta]
    R_KK:    [Kp, Km]
    R_Keta:
      - [Km, eta]          # R_Keta_0
      - [Kp, eta]          # R_Keta_1

    intermediates:
      R_KK:
        - [J: 1, P: -1]: [phi1020, rho1700]
        - [J: 0, P: +1]: [f0_980]
      R_Keta:
        - [J: 1, P: -1]: [K1_1410]

    legends:
      - ['R_KK',     ' → ', 'eta']
      - ['R_Keta_0', ' → ', 'Kp']
      - ['R_Keta_1', ' → ', 'Km']

  # 链 2: J/ψ → η f0, f0 → π⁺π⁻ (GS 模型演示)
  chain2:
    Jpsi: [[eta, R_pipi]]
    R_pipi: [pip, pim]
    intermediates:
      R_pipi:
        - [J: 1, P: -1]: [rho_770]
    legends: [['R_pipi', ' → ', 'eta']]

  # 次级衰变 opts 支持: is_bf / p_break / sl（分波白名单, S 为 2S+1 记号）
  #   R_KK: [Kp, Km, {sl: [[1, 0], [3, 2]]}]   # 只保留指定 (S,L)
  #   Jpsi: [[eta, R_KK, {sl: [3, 1]}]]        # 第一步只保留 S=1, L=1

# ---- 约束 ----
Constraints:
  trans:
    - [R_Keta_0, R_Keta_1]: -1   # Kη 两个道共享参数，互为相反数
  # identical:                     # 全同粒子组（自动 Bose/Fermi 对称化）
  #   - [Ks1, Ks2]                 # Ks1/Ks2 是全同粒子组
  # maxL: 4                        # 全局轨道角动量上限
  # bf_d: 3.0                        # 势垒半径 (GeV⁻¹)
  # chains:                        # 链过滤器: 只跑名中包含子串的衰变链
  #   - decay1                     #   内联列表
  # chains: "chains_to_fit.txt"    #   或外部文件（每行一个子串, # 注释）

# ============================================================
# 共振态 — 每种模型一个示例
# ============================================================
Resonances:
  # ---------- BWR (相对论 BW, 默认模型) ----------
  phi1020:
    J: 1
    P: -1
    model: BWR
    parameters: [1.0195, 0.0045]          # [mass, width]
    tex: ["\\phi(1020)"]

  rho1700:
    J: 1
    P: -1
    model: BWR
    parameters: [1.72, 0.25]
    free: [0, 1]                          # 放开拟合
    free_range: [[1.6, 1.8], [0.1, 0.5]] # 拟合范围
    tex: ["\\rho(1700)"]

  # ---------- BW (非相对论 BW, 无势垒因子) ----------
  # K1_1410:
  #   J: 1
  #   P: -1
  #   model: BW
  #   parameters: [1.414, 0.232]
  #   free: [0, 1]
  #   tex: ["K_{1}(1410)"]

  # ---------- Flatte (耦合道, 近阈共振态) ----------
  # f0_980 耦合到 ππ 和 KK, 参数 [mass, g_ππ, g_KK]
  f0_980:
    J: 0
    P: +1
    model: Flatte
    parameters: [0.99, 0.2, 0.4]               # [m0, g_pipi, g_KK]
    free: [0, 1, 2]
    channels: [[0.1396, 0.1396], [0.4937, 0.4937]]
    tex: ["f_{0}(980)"]

  # ---------- GS (Gounaris-Sakurai, ρ→ππ P 波) ----------
  rho_770:
    J: 1
    P: -1
    model: GS
    parameters: [0.775, 0.149]                  # [mass, width]
    free: [0, 1]
    channels: [[0.1396, 0.1396]]               # 道质量 [m_π⁺, m_π⁻]
    tex: ["\\rho(770)"]

  # ---------- ONE (纯势垒因子, 无共振态传播子) ----------
  # K1_1410:
  #   J: 1
  #   P: -1
  #   model: ONE
  #   parameters: []

  # ---------- Interp (统一插值模型: hist/linear/spline) ----------
  # bg_shape:
  #   J: 1
  #   P: -1
  #   model: Interp
  #   parameters: []                          # 无自由参数
  #   options:
  #     file: "./data/shape.dat"              # 两列: m, value
  #     method: spline                        # hist | linear | spline

  # ---------- Custom DSL (用户自定义表达式) ----------
  # 可用变量: m, q, q0, L, d, md1, md2
  #           p1p, p1e, p1costheta, p1phi, p2p, p2e, p2costheta, p2phi
  # 可用参数: p0, p1, p2, ... (对应 paramValues 列表; 旧名 parameters 兼容)
  # 参数名:  paramNames: [p0, p1, ...]        (旧名 params 兼容)
  # 可用函数: exp, log, sin, cos, sqrt, csqrt, abs, re, im, conj
  # 模型函数: BW(m0, w0), BWR(m0, g0[, L, d]), Bf(L, q, q0, d),
  #           q0(x[, md1, md2]), Flatte(m0, g..., (ma,mb)...)
  # 可用常量: pi, i (虚数单位)
  #
  # 示例: BWR 变体, 用 |p1| 代替 q
  # my_res:
  #   J: 1
  #   P: -1
  #   model: Custom
  #   paramValues: [1.5, 0.12]               # p0=mass, p1=width
  #   paramNames: [p0, p1]
  #   free: [0, 1]
  #   expression: "p0^2/(p0^2 - m^2 - i*p0*p1*(p1p/q0)*(p0/m)*(p1p^2+q0^2)/q0^2)"
  #   tex: ["MyRes"]

  # BWR 使用 Custom DSL 等价写法 (g0=1, φ=0 时 ≡ 内置 BW):
  # bw_custom:
  #   J: 1
  #   P: -1
  #   model: Custom
  #   paramValues: [1.66, 0.125]
  #   paramNames: [p0, p1]
  #   free: [0, 1]
  #   expression: "p0^2/(p0^2 - m^2 - i*p0*p1)"
  #   tex: ["BW", "(custom)"]

  # 模型函数写法: 内置 BWR + 势垒因子 (与内置模型逐点一致):
  # bwr_custom:
  #   J: 1
  #   P: -1
  #   model: Custom
  #   paramValues: [1.66, 0.125]
  #   paramNames: [p0, p1]
  #   free: [0, 1]
  #   expression: "BWR(p0, p1, 1, 3.0) * Bf(1, q, q0(m), 3.0)"
  #   tex: ["BWR", "(custom)"]

# ---- 输出绘图 ----
# 统一形式 (Plot 直接是观测列表; 1d=一个表达式, 2d=两个; expr 与 expression 等价):
#   Plot:
#     - name: m_KK                          # 输出目录名; 缺省 obsN
#       expression: "M([Kp,Km])"            # 系统不变质量: [粒子列表] = 系统 (括号可省)
#       bins: [100]; ranges: [[1.0, 2.6]]
#       display: ["M(K^{+}K^{-}) (GeV/c^{2})", "Events"]
#     - expression: "Phi([Kp])"             # K+ 在顶层母粒子静系内方位角
#       bins: [40]; ranges: [[-3.15, 3.15]]
#     - expression: ["M([Kp,Km])", "CosAngle([Kp], [Kp,Km])"]   # 2d: 质量 × cosβ (逗号同义于分号)
#       bins: [100, 50]; ranges: [[1.0, 2.6], [-1, 1]]
#   语法: Func([主体系统], [帧系统]) —— 第二组=帧(缺省=顶层母粒子静系); ";" 与 "," 等价, 括号可省;
#   函数: M/M2/P/E/Perp/Pt/Theta/Phi/CosTheta/Angle/CosAngle (全部先对系统 4-矢量和);
#   Angle/CosAngle = 与顶层母粒子动量的夹角(余弦)。中间态名不可用作帧(写成其末态子集)。
# 旧格式 (mass/cosbeta/dalitz 键) 仍然支持, 语义与上面等价。
Plot:
  # 不变质量谱
  mass:
    - input: [Kp, Km]
      bins: 100; range: [1.0, 2.6]
      display: ["M(K^{+}K^{-}) (GeV/c^{2})", "Events/16 MeV/c^{2}"]
    - input: [Kp, eta]
      bins: 100; range: [1.0, 2.6]
      display: ["M(K^{+}\\eta) (GeV/c^{2})", "Events/16 MeV/c^{2}"]
    - input: [Km, eta]
      bins: 100; range: [1.0, 2.6]
      display: ["M(K^{-}\\eta) (GeV/c^{2})", "Events/16 MeV/c^{2}"]
    - input: [pip, pim]
      bins: 100; range: [0.27, 1.5]
      display: ["M(\\pi^{+}\\pi^{-}) (GeV/c^{2})", "Events/12.3 MeV/c^{2}"]

  # 螺旋度角
  cosbeta:
    - input: [[Jpsi], [Kp, Km], [Kp]]
      bins: 100; range: [-1.0, 1.0]
      display: ["cos\\beta(K^{+}K^{-})", "Events/0.02"]

  # Dalitz 图
  dalitz:
    - input: [[Kp, Km], [Kp, eta]]
      bins: [100, 100]; range: [[1.0, 6.8], [1.0, 6.8]]
      display: ["M^{2}(K^{+}K^{-}) (GeV^{2}/c^{4})", "M^{2}(K^{+}\\eta) (GeV^{2}/c^{4})"]

# 精度档位: auto(缺省)/hybrid = A 存 float + double 核心; double = 全 double;
# float = 全 float 档（模板化双实例, 分批接线中——未接线入口会显式报错）
