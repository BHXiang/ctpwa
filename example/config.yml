# ============================================================
# ctpwa config.yml — 示例配置（展示所有功能）
# ============================================================
# 衰变链支持两种等价写法：
#   紧凑格式（推荐）:
#     chain_name:
#       mother:
#         - [daughter1, intermediate]
#       intermediate: [d1, d2]
#       intermediates:
#         intermediate:
#           - [J: 1, P: -1]: [res1, res2]
#   展开格式:
#     chain_name:
#       decay:
#         - mother: [daughter1, intermediate]
#         - intermediate: [d1, d2]
#       intermediate:
#         - [J: 1, P: -1]: [res1, res2]
#
# 可用模型: BWR | BW | Flatte | GS | ONE | Interp | Custom
# ============================================================

# ---- 粒子定义 ----
Particles:
  Jpsi:       {J: 1, P: -1, mass: 3.0969, tex: ['J/\\psi']}
  eta:        {J: 0, P: -1, mass: 0.5478, tex: ['\\eta']}
  Kp:         {J: 0, P: -1, mass: 0.4937, tex: ['K^{+}']}
  Km:         {J: 0, P: -1, mass: 0.4937, tex: ['K^{-}']}
  pi0:        {J: 0, P: -1, mass: 0.1350, tex: ['\\pi^{0}']}
  pip:        {J: 0, P: -1, mass: 0.1396, tex: ['\\pi^{+}']}
  pim:        {J: 0, P: -1, mass: 0.1396, tex: ['\\pi^{-}']}

# ---- 数据源 ----
Data:
  order: [Kp, Km, eta]
  data:  [dat, "./data.dat"]
  phsp:  [dat, "./phsp.dat"]
  # bkg:   [dat, "./bkg.dat"]

  # ROOT 文件格式 (TBranch 名与 order 中粒子名顺序一致):
  # data: [ROOT, "/path/file.root", TTree, Kp, Km, eta]
  # phsp: [ROOT, "/path/file.root", TTree, Kp, Km, eta]

# ---- 衰变链 ----
DecayChains:
  # 链 1: J/ψ → η KK / K⁺ Kη / K⁻ Kη (三体衰变)
  decay1:
    Jpsi:
      - [eta, R_KK]
      - [Kp, R_Keta]
      - [Km, R_Keta]
    R_KK:    [Kp, Km]
    R_Keta:
      - [Km, eta]          # R_Keta_0
      - [Kp, eta]          # R_Keta_1

    intermediates:
      R_KK:
        - [J: 1, P: -1]: [phi1020, rho1700]
        - [J: 0, P: +1]: [f0_980]
      R_Keta:
        - [J: 1, P: -1]: [K1_1410]

    legends:
      - ['R_KK',     ' → ', 'eta']
      - ['R_Keta_0', ' → ', 'Kp']
      - ['R_Keta_1', ' → ', 'Km']

  # 链 2: J/ψ → η f0, f0 → π⁺π⁻ (GS 模型演示)
  chain2:
    Jpsi: [[eta, R_pipi]]
    R_pipi: [pip, pim]
    intermediates:
      R_pipi:
        - [J: 1, P: -1]: [rho_770]
    legends: [['R_pipi', ' → ', 'eta']]

# ---- 约束 ----
Constraints:
  trans:
    - [R_Keta_0, R_Keta_1]: -1   # Kη 两个道共享参数，互为相反数
  # identical:                     # 全同粒子组（自动 Bose/Fermi 对称化）
  #   - [pi0, pi0]: true
  # maxL: 4                        # 全局轨道角动量上限
  bf_d: 3.0                        # 势垒半径 (GeV⁻¹)

# ============================================================
# 共振态 — 每种模型一个示例
# ============================================================
Resonances:
  # ---------- BWR (相对论 BW, 默认模型) ----------
  phi1020:
    J: 1; P: -1; model: BWR
    parameters: [1.0195, 0.0045]          # [mass, width]
    tex: ["\\phi(1020)"]

  rho1700:
    J: 1; P: -1; model: BWR
    parameters: [1.72, 0.25]
    free: [0, 1]                          # 放开拟合
    free_range: [[1.6, 1.8], [0.1, 0.5]] # 拟合范围
    tex: ["\\rho(1700)"]

  # ---------- BW (非相对论 BW, 无势垒因子) ----------
  # K1_1410:
  #   J: 1; P: -1; model: BW
  #   parameters: [1.414, 0.232]
  #   free: [0, 1]
  #   tex: ["K_{1}(1410)"]

  # ---------- Flatte (耦合道, 近阈共振态) ----------
  # f0_980 耦合到 ππ 和 KK, 参数 [mass, g_ππ, g_KK]
  f0_980:
    J: 0; P: +1; model: Flatte
    parameters: [0.99, 0.2, 0.4]               # [m0, g_pipi, g_KK]
    free: [0, 1, 2]
    channels: [[0.1396, 0.1396], [0.4937, 0.4937]]
    tex: ["f_{0}(980)"]

  # ---------- GS (Gounaris-Sakurai, ρ→ππ P 波) ----------
  rho_770:
    J: 1; P: -1; model: GS
    parameters: [0.775, 0.149]                  # [mass, width]
    free: [0, 1]
    channels: [[0.1396, 0.1396]]               # 道质量 [m_π⁺, m_π⁻]
    tex: ["\\rho(770)"]

  # ---------- ONE (纯势垒因子, 无共振态传播子) ----------
  # K1_1410:
  #   J: 1; P: -1; model: ONE
  #   parameters: []

  # ---------- Interp (统一插值模型: hist/linear/spline) ----------
  # bg_shape:
  #   J: 1; P: -1; model: Interp
  #   parameters: []                          # 无自由参数
  #   options:
  #     file: "./data/shape.dat"              # 两列: m, value
  #     method: spline                        # hist | linear | spline

  # ---------- Custom DSL (用户自定义表达式) ----------
  # 可用变量: m, q, q0, L, d, md1, md2
  #           p1p, p1e, p1costheta, p1phi, p2p, p2e, p2costheta, p2phi
  # 可用参数: p0, p1, p2, ... (对应 parameters 列表)
  # 可用函数: exp, log, sin, cos, sqrt, csqrt, abs, re, im, conj
  # 可用常量: pi, i (虚数单位)
  #
  # 示例: BWR 变体, 用 |p1| 代替 q
  # my_res:
  #   J: 1; P: -1; model: Custom
  #   parameters: [1.5, 0.12]                # p0=mass, p1=width
  #   free: [0, 1]
  #   expression: "p0^2/(p0^2 - m^2 - i*p0*p1*(p1p/q0)*(p0/m)*(p1p^2+q0^2)/q0^2)"
  #   tex: ["MyRes"]

  # BWR 使用 Custom DSL 等价写法 (g0=1, φ=0 时 ≡ 内置 BW):
  # bw_custom:
  #   J: 1; P: -1; model: Custom
  #   parameters: [1.66, 0.125]
  #   free: [0, 1]
  #   expression: "p0^2/(p0^2 - m^2 - i*p0*p1)"
  #   tex: ["BW", "(custom)"]

# ---- 输出绘图 ----
Plot:
  # 不变质量谱
  mass:
    - input: [Kp, Km]
      bins: 100; range: [1.0, 2.6]
      display: ["M(K^{+}K^{-}) (GeV/c^{2})", "Events/16 MeV/c^{2}"]
    - input: [Kp, eta]
      bins: 100; range: [1.0, 2.6]
      display: ["M(K^{+}\\eta) (GeV/c^{2})", "Events/16 MeV/c^{2}"]
    - input: [Km, eta]
      bins: 100; range: [1.0, 2.6]
      display: ["M(K^{-}\\eta) (GeV/c^{2})", "Events/16 MeV/c^{2}"]
    - input: [pip, pim]
      bins: 100; range: [0.27, 1.5]
      display: ["M(\\pi^{+}\\pi^{-}) (GeV/c^{2})", "Events/12.3 MeV/c^{2}"]

  # 螺旋度角
  cosbeta:
    - input: [[Jpsi], [Kp, Km], [Kp]]
      bins: 100; range: [-1.0, 1.0]
      display: ["cos\\beta(K^{+}K^{-})", "Events/0.02"]

  # Dalitz 图
  dalitz:
    - input: [[Kp, Km], [Kp, eta]]
      bins: [100, 100]; range: [[1.0, 6.8], [1.0, 6.8]]
      display: ["M^{2}(K^{+}K^{-}) (GeV^{2}/c^{4})", "M^{2}(K^{+}\\eta) (GeV^{2}/c^{4})"]
